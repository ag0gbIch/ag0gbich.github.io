<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080c11">
<meta name="description" content="Два приложения в одном: умный распорядок дня и 12-недельный план по кибербезу.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="День и кибербез">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>День и кибербез</title>
<style>
  :root{--bg:#080c11;--line:#1d2833;--txt:#e8eff6;--muted:#8b9dad;--acc:#2ee6a8}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden;overscroll-behavior:none}
  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .nav{
    display:flex;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:rgba(8,12,17,.94);border-bottom:1px solid var(--line);
    backdrop-filter:blur(10px);flex:none
  }
  .nav button{
    flex:1;appearance:none;font:inherit;font-size:13.5px;padding:9px 10px;border-radius:10px;
    border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;transition:.15s
  }
  .nav button.on{color:var(--acc);background:rgba(46,230,168,.1);border-color:rgba(46,230,168,.25);font-weight:600}
  .stage{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" id="nav">
    <button type="button" data-app="day" class="on">День</button>
    <button type="button" data-app="cyber">Кибербез</button>
  </nav>
  <div class="stage">
    <iframe id="fDay" src="day.html" title="Умный день"></iframe>
    <iframe id="fCyber" src="cyber.html" title="Кибербез" class="hidden"></iframe>
  </div>
</div>
<script>
(function(){
  "use strict";
  var KEY = "shell-app";
  var frames = { day: "fDay", cyber: "fCyber" };

  function show(name){
    if(!frames[name]) name = "day";
    for(var k in frames){
      var f = document.getElementById(frames[k]);
      if(f) f.classList.toggle("hidden", k !== name);
    }
    var btns = document.querySelectorAll("#nav button");
    for(var i = 0; i < btns.length; i++){
      btns[i].classList.toggle("on", btns[i].getAttribute("data-app") === name);
    }
    try { localStorage.setItem(KEY, name); } catch(e){}
  }

  document.getElementById("nav").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button[data-app]") : null;
    if(b) show(b.getAttribute("data-app"));
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  show(saved || "day");

  if("serviceWorker" in navigator &&
     (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
